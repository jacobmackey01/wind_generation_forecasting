<title id="figure-title">Fold-level XGBoost MAE skill versus the SMARD wind forecast</title>
<desc id="figure-desc">12 chronological rolling-calibration folds. Seven folds improve and five worsen. Pooled skill is +0.34%, while the Newey-West 95 percent skill interval is -2.91% to +3.60% and crosses zero.</desc>
